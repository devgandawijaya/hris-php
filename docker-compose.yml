services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rihris-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=rihris_db
      - DB_USERNAME=rihris_user
      - DB_PASSWORD=rihris_password_secure
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rihris-network

  nginx:
    image: nginx:alpine
    container_name: rihris-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - rihris-network

  postgres:
    image: postgres:16-alpine
    container_name: rihris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rihris_db
      POSTGRES_USER: rihris_user
      POSTGRES_PASSWORD: rihris_password_secure
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rihris_user -d rihris_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rihris-network

  redis:
    image: redis:7-alpine
    container_name: rihris-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rihris-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rihris-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rihris-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rihris-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rihris-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  rihris-network:
    driver: bridge

